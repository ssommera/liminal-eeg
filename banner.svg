<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#3d2f7e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3d2f7e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0a3e;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#4a2090;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#7b4fd4;stop-opacity:0.9" />
      <stop offset="80%" style="stop-color:#4a2090;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1a0a3e;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="0" y1="140" x2="1200" y2="140" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="280" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="280" stroke="#1a1a3e" stroke-width="0.5"/>
  <line x1="900" y1="0" x2="900" y2="280" stroke="#1a1a3e" stroke-width="0.5"/>

  <!-- EEG waveform — flat baseline then surge -->
  <!-- Flat baseline left -->
  <polyline points="0,140 80,140 110,140 130,140" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.3"/>
  <!-- Delta slow wave -->
  <path d="M 100,140 Q 130,155 160,140 Q 190,125 220,140" fill="none" stroke="#3d2f7e" stroke-width="1.5" opacity="0.5"/>
  <!-- Theta -->
  <path d="M 220,140 Q 235,150 250,140 Q 265,130 280,140 Q 295,150 310,140 Q 325,130 340,140" fill="none" stroke="#4a3a9e" stroke-width="1.5" opacity="0.6"/>
  <!-- Alpha buildup -->
  <path d="M 340,140 Q 355,148 370,140 Q 385,132 400,140 Q 415,148 430,140 Q 445,132 460,140 Q 475,148 490,140" fill="none" stroke="#5a4abe" stroke-width="1.8" opacity="0.7"/>
  <!-- Gamma surge — the NDE moment -->
  <path d="M 490,140 Q 500,130 510,100 Q 515,75 520,50 Q 525,20 530,10 Q 535,20 540,50 Q 545,80 550,105 Q 558,130 565,120 Q 572,108 578,118 Q 584,130 590,122 Q 596,112 602,120 Q 608,132 615,125 Q 622,116 628,124 Q 634,134 640,140" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.95"/>
  <!-- Post-surge decay -->
  <path d="M 640,140 Q 660,145 680,140 Q 700,135 720,140 Q 740,143 760,140 Q 800,140 850,140 Q 950,140 1100,140" fill="none" stroke="#3d2f7e" stroke-width="1.5" opacity="0.4"/>

  <!-- Glow orb at the surge peak -->
  <circle cx="530" cy="12" r="18" fill="#7b4fd4" opacity="0.08" filter="url(#softglow)"/>
  <circle cx="530" cy="12" r="6" fill="#a07fff" opacity="0.25" filter="url(#glow)"/>

  <!-- Horizontal rule -->
  <rect x="0" y="195" width="1200" height="0.75" fill="url(#lineGrad)"/>

  <!-- Title -->
  <text x="600" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700"
    fill="#e8e0ff" text-anchor="middle" letter-spacing="6" filter="url(#glow)">liminal-eeg</text>

  <!-- Subtitle -->
  <text x="600" y="125" font-family="'Courier New', monospace" font-size="13"
    fill="#7b6ab0" text-anchor="middle" letter-spacing="3">THRESHOLD CONSCIOUSNESS · EEG · DEEP LEARNING</text>

  <!-- Tagline -->
  <text x="600" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="15"
    fill="#9d8ec0" text-anchor="middle" font-style="italic" letter-spacing="1">What does the brain look like at the edge of death?</text>

  <!-- Corner markers -->
  <text x="24" y="24" font-family="'Courier New', monospace" font-size="9" fill="#2a2050" letter-spacing="2">ZENODO:3992359</text>
  <text x="1176" y="24" font-family="'Courier New', monospace" font-size="9" fill="#2a2050" letter-spacing="2" text-anchor="end">N=34 · 4273 EPOCHS</text>
  <text x="24" y="268" font-family="'Courier New', monospace" font-size="9" fill="#2a2050" letter-spacing="2">DMT · NDE · EEG</text>
  <text x="1176" y="268" font-family="'Courier New', monospace" font-size="9" fill="#2a2050" letter-spacing="2" text-anchor="end">ssommera · 2025</text>
</svg>
